name: Fontbakery Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  fontbakery:
    name: Fontbakery Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Fontbakery
        run: |
          pip install "fontbakery[googlefonts]>=0.8.15" "glyphsets>=0.6.0"

      - name: Run Fontbakery check
        run: |
          fontbakery check-googlefonts fonts/*.ttf \
            --skip "com.google.fonts/check/nameid1-too-long" \
            --skip "com.google.fonts/check/too-many" \
            --skip "com.google.fonts/check/no-stat"

      - name: Upload Fontbakery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fontbakery-report
          path: fontbakery-report.html
          retention-days: 7